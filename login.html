
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142640">
  <title>Login | Mandiri Startup Academy</title>

  <style>
    :root {
      --navy: #142640;
      --navy-light: #203b5e;
      --gold: #c9a65d;
      --bg: #f4f6fa;
      --text: #263449;
      --muted: #69778b;
      --border: #dfe5ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at top right, #e9dfc8 0, transparent 30%),
        var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 55px rgba(20, 38, 64, .10);
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--gold);
      color: var(--navy);
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 22px;
    }

    h1 {
      color: var(--navy);
      font-size: 27px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 25px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field { margin-bottom: 18px; }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,166,93,.16);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      background: var(--navy);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      margin: 0 0 17px;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .message.error { background: #fff0f0; color: #a12626; }
    .message.success { background: #eaf8ef; color: #17683b; }

    .links {
      margin-top: 20px;
      display: grid;
      gap: 12px;
      text-align: center;
      font-size: 13px;
    }

    a { color: var(--navy-light); font-weight: 700; }
    .back { color: var(--muted); font-weight: 400; }

    @media (max-width: 480px) {
      .login-card { padding: 25px 21px; }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">M</div>

    <h1>Selamat Datang</h1>
    <p class="subtitle">
      Masuk ke Mandiri Startup Academy untuk membangun brand,
      mengembangkan produk, dan mengelola bisnis Anda.
    </p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="nama@email.com"
          required
        >
      </div>

      <div class="field">
        <label for="password">Kata sandi</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Masukkan kata sandi"
          required
        >
      </div>

      <button id="loginButton" type="submit">Masuk ke Platform</button>
    </form>

    <div class="links">
      <a href="register.html">Belum memiliki akun? Daftar sebagai siswa</a>
      <a href="#" id="resetLink">Lupa kata sandi?</a>
      <a class="back" href="index.html">← Kembali ke beranda</a>
    </div>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    // GANTI dengan konfigurasi aplikasi web Firebase milik Anda.
    const firebaseConfig = {
      apiKey: "GANTI_DENGAN_API_KEY",
      authDomain: "GANTI_DENGAN_AUTH_DOMAIN",
      projectId: "GANTI_DENGAN_PROJECT_ID",
      storageBucket: "GANTI_DENGAN_STORAGE_BUCKET",
      messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID",
      appId: "GANTI_DENGAN_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function getErrorMessage(error) {
      const messages = {
        "auth/invalid-email": "Format email tidak valid.",
        "auth/invalid-credential": "Email atau kata sandi tidak cocok.",
        "auth/user-not-found": "Akun tidak ditemukan.",
        "auth/wrong-password": "Kata sandi tidak cocok.",
        "auth/too-many-requests": "Terlalu banyak percobaan. Coba lagi nanti.",
        "auth/network-request-failed": "Koneksi internet bermasalah.",
        "permission-denied": "Akses profil ditolak oleh aturan keamanan Firebase."
      };

      return messages[error.code] ||
        "Login belum berhasil. Periksa konfigurasi dan pengaturan Firebase.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Memeriksa akun...";
      message.className = "message";

      let user = null;

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );

        user = credential.user;

        const profileRef = doc(db, "users", user.uid);
        const profileSnapshot = await getDoc(profileRef);

        if (!profileSnapshot.exists()) {
          await signOut(auth);
          showMessage(
            "Akun berhasil diautentikasi, tetapi profil pengguna belum tersedia. Hubungi administrator sekolah."
          );
          return;
        }

        const profile = profileSnapshot.data();

        if (profile.status !== "active") {
          await signOut(auth);
          showMessage(
            "Akun Anda belum aktif atau masih menunggu persetujuan sekolah."
          );
          return;
        }

        const destinations = {
          siswa: "dashboard/student.html",
          guru: "dashboard/teacher.html",
          admin: "dashboard/admin.html"
        };

        const destination = destinations[profile.role];

        if (!destination) {
          await signOut(auth);
          showMessage(
            "Peran akun belum dikenali. Hubungi administrator sekolah."
          );
          return;
        }

        window.location.assign(destination);
      } catch (error) {
        if (user) {
          try {
            await signOut(auth);
          } catch (_) {
            // Sesi akan diperiksa kembali saat login berikutnya.
          }
        }

        console.error("Login error:", error);
        showMessage(getErrorMessage(error));
      } finally {
        button.disabled = false;
        button.textContent = "Masuk ke Platform";
      }
    });

    document.getElementById("resetLink").addEventListener("click", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Masukkan email Anda terlebih dahulu untuk reset kata sandi.");
        emailInput.focus();
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage(
          "Jika email terdaftar, ikuti instruksi reset kata sandi yang dikirimkan.",
          "success"
        );
      } catch (error) {
        console.error("Password reset error:", error);
        showMessage(getErrorMessage(error));
      }
    });
  </script>
</body>
</html>
